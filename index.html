<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <section id="form-card">

        <div class="form-card1" >
    <h2>Form</h2>
    <p>Please fill out this form.</p>
    
    </div>

    

    <form method="post">
        <div class="wrapper">
        <div class="form-card2">

        <div>
        <label for="fname">Name:
            <input type="text" name="name" id="fname" placeholder="Enter your full name" required size="35"> 
        </label>
        </div>

         <div>
        <label for="location">Address
            <input type="text" name="address" id="location" placeholder="Enter your address" required size="34">
        </label>
        </div>

        <div>
        <label for="email">Email:
            <input type="text" name="email" id="email" placeholder="Enter your email" required size="35">
        </label>
        </div>
            
        <div>
        <label for="job">Occupation:
            <input type="text" name="occupation" id="job" placeholder="Enter your occupation" required size="30">
        </label>
        </div>

        <div>
        <label for="dob">Date of birth:
            <input type="date" name="date of birth" id="dob" placeholder="Enter date of birth" required>
        </label>
        </div>

        <div>
        <label for="message">Message:
            <textarea id="message" placeholder="Write your message here!"></textarea>
        </label>
        </div>

        <div>
            <label> <mark>What position are you applying for?</mark>
                <select>
                    <option>Marketing manager</option>
                    <option>ICT manager</option>
                    <option>Account manager</option>
                    <option>HR manager</option>
                    <option>Security manager</option>
                    <option>Procurement manager</option>
                    <option>Administrator </option>
                    <option>Sales rep</option>
                    <option>Causual worker</option>
                    <option>Medical manager</option>
                    <option>Suppervisor</option>
                </select>
            </label>
        </div>
        </div>


        <div class="form-card3">
        <h3>Social Media Contact</h3>

         <div>
        <label for="fbook">Facebook:
            <input type="text" name="facebook" id="fbook" placeholder="Enter facebook profile" required size="35">
        </label>
        </div>

        <div>
        <label for="linkedin">Linkedln:
            <input type="text" name="linkedin" id="linkedin" placeholder="Enter linkedIn profile" required size="36">
        </label>
        </div>

        <div>
        <label for="twitter">Twitter:
            <input type="text" name="twitter" id="fbook" placeholder="Enter twitter profile" required size="38">
        </label>
        </div>

        <div>
            <label for="cv">Upload cv
                <input type="file" name="file" accept=".pdf,.docs,.docx" required>
            </label>
            </div>

            <div>
            <label for="photo">Passport
                <input type="file" name="passport" id="photo" accept=".jpg, .png, .jpeg" required>

            </label>
        </div>
        </div>

        <p></p>

        <div class="form-card4"><br>
            <strong> <mark> How did you hear about us?</mark> </strong>

            <div>
            <label>Internet
                <input type="checkbox">
            </label>
            </div>

            <div>
            <label>Radio
                <input type="checkbox">
            </label>
            </div>

            <div>
            <label>Television
                <input type="checkbox">
            </label>
            </div>

            <div>
            <label>Social media
                <input type="checkbox">
            </label>
            </div>

            <div>
            <label>Friends
                <input type="checkbox">
            </label>
            </div>

            <div>
            <strong> <mark>What is your favorite color?</mark> </strong>
            </div>

            <div>
            <label>White
                <input type="radio" name="what's favourite color">
            </label>
            </div>

            <div>
            <label>Red
                <input type="radio" name="what's favourite color">
            </label>
            </div>

            <div>
            <label>Black
                <input type="radio" name="what's favourite color">
            </label>
            </div>

            <div>
            <label>Green
                <input type="radio" name="what's favourite color">
            </label>
            </div>


            <div>
            <label>Yellow
                <input type="radio" name="what's favourite color">
            </label>
            </div>

            <div>
            <label>Blue
                <input type="radio" name="what's favourite color">
            </label>
            </div>

            <div>
            <label>Others
                <input type="radio" name="what's favourite color">
            </label>
            </div>

             </div>

             

           
        <button type="submit" name="button">Submit</button>
        <button type="reset" name="button">Clear</button>
        </div>
        
    </form>
    </section>

    
</body>
</html>
